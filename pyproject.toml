[project]
name = "onedata-mcp"
version = "0.1.0"
description = "Collection"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp==3.2.4",
    "python-dotenv>=1.2.2",
]


[project.scripts]
onedata-mcp = "onedata_mcp.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "matplotlib>=3.10.9",
    "mcp[cli]>=1.27.0",
    "openai>=1.88.0",
    "pygount>=3.2.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-httpx>=0.35.0",
    "ruff>=0.11.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "UP045"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
reportUnusedFunction = "none"
# Mirror test/conftest.py sys.path so support modules resolve (isolated_helpers, etc.).
extraPaths = ["test/support"]

[tool.pytest.ini_options]
# Single-process only: avoid pytest-xdist multi-worker runs even if installed globally / in tooling.
addopts = [ "-p", "no:xdist", "-m", "not legacy" ]
asyncio_mode = "strict"
asyncio_default_test_loop_scope = "function"
asyncio_default_fixture_loop_scope = "function"
testpaths = [ "test" ]
markers = [
    "e2e: End-to-end PLGrid Forge LLM + MCP tests (requires PLGRID_FORGE_* env; some need Onedata)",
    "onedata_integration: requires live Onezone / Oneprovider",
    "e2e_isolated_space_group(name): reuse one isolated space for tests in the same group; contents reset per test",
    "e2e_isolated: isolated-space E2E (dedicated space + confined Oneprovider token per test)",
    "e2e_isolated_confined_write: use read-write confined token for MCP (default is data.readonly)",
    'e2e_scenario(id): isolated scenario id from docs/onedata-mcp-e2e-test-scenarios.md (e.g. "list-spaces")',
    "legacy: shared-space Forge E2E under test/e2e/legacy (excluded from default pytest)",
    "allow_mcp_write_tools(tool,...): allow listed mutating MCP tools (create_file, delete_file, set_file_xattrs, set_file_metadata)",
    "shared_tenant: read-only integration tests on shared PLGrid spaces (github_dataset, europeana, ...)",
]
